<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <title>Ward Bulletin</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%);
        min-height: 100vh;
      }
      .container {
        max-width: 56rem;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .bulletin {
        background: white;
        border-radius: 1rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        padding: 2rem;
      }
      .header {
        text-align: center;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 2px solid #e5e7eb;
      }
      .ward-name {
        font-size: 2rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 0.5rem;
      }
      .date {
        font-size: 1.125rem;
        color: #6b7280;
      }
      .section {
        margin-bottom: 2rem;
      }
      .section-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #e5e7eb;
      }
      .item {
        margin-bottom: 0.75rem;
        padding: 0.5rem;
      }
      .item-label {
        font-weight: 600;
        color: #374151;
      }
      .item-value {
        color: #6b7280;
      }
      .loading {
        text-align: center;
        padding: 4rem 2rem;
      }
      .spinner {
        border: 3px solid #e5e7eb;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 3rem;
        height: 3rem;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .error {
        background: #fee2e2;
        border: 1px solid #fecaca;
        color: #991b1b;
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
      }
      .retry-btn {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 1rem;
      }
      .retry-btn:hover {
        background: #2563eb;
      }
      .agenda-item {
        display: flex;
        justify-content: space-between;
        align-items: start;
        padding: 0.75rem;
        border-bottom: 1px solid #f3f4f6;
      }
      .footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #e5e7eb;
        color: #6b7280;
        font-size: 0.875rem;
      }
      .footer a {
        color: #3b82f6;
        text-decoration: none;
      }
      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="app">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading bulletin...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/public.ts"></script>
  </body>
</html>
